# Fly.io app config for the API + background worker.
# Both process groups share the same image (server/api/Dockerfile); only the
# start command differs. Deploy with `fly deploy` from this directory.
#
# One-time setup (run yourself — needs your browser login):
#   fly auth login
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_KEY=... DATABASE_URL=... \
#     GEMINI_API_KEY=... GROQ_API_KEY=... APIFY_API_TOKEN=... USER_EMAIL=... \
#     COMPILE_SERVICE_URL=http://<compile-app-name>.internal:8001
#   fly deploy
#   fly scale count app=1 worker=1

app = "gethired-api"
primary_region = "bom"

[build]

[processes]
app = "uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
worker = "uv run python -m app.worker"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
timeout = "5s"
path = "/health"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
processes = ["app"]

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
processes = ["worker"]
