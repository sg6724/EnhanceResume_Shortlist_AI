# Local dev: api + compile service.
# No Redis — queuing via Procrastinate on Supabase Postgres.
# Postgres = Supabase cloud (no local container).
# Next.js runs separately: cd client && npm run dev
# Worker runs separately: cd server/api && uv run python -m app.worker

services:
  compile:
    build: ./server/compile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./server/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      COMPILE_SERVICE_URL: http://compile:8001
    depends_on:
      compile:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
