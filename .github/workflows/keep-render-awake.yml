name: Keep Render Awake

on:
  schedule:
    # Render free web services sleep after inactivity. Ping health endpoints often
    # enough to keep them warm while leaving some room for GitHub schedule drift.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping configured URLs
        env:
          KEEP_AWAKE_URLS: |
            https://gethired-api-c7et.onrender.com/health
            https://gethired-compile.onrender.com/health
        run: |
          set -uo pipefail

          if [ -z "${KEEP_AWAKE_URLS}" ]; then
            echo "RENDER_KEEP_AWAKE_URLS is not configured; skipping."
            exit 0
          fi

          failures=0
          while IFS= read -r url; do
            [ -z "${url}" ] && continue
            echo "Pinging ${url}"
            if ! curl --fail --silent --show-error --max-time 45 --retry 3 --retry-delay 10 "${url}" > /dev/null; then
              echo "::warning::Keep-awake ping failed for ${url}"
              failures=$((failures + 1))
            fi
          done <<< "${KEEP_AWAKE_URLS}"

          if [ "${failures}" -gt 0 ]; then
            echo "::notice::${failures} keep-awake ping(s) failed. This is non-blocking because Render free services can cold-start slowly."
          fi
